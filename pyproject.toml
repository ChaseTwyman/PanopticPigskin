[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl_gsplat"
version = "0.1.0"
description = "PanopticPigskin: two broadcast All-22 clips of an NFL play -> calibrated cameras, tracked and named players, SMPL-X bodies fitted to both views, Gaussian-splat renders from any angle"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
readme = "README.md"
dependencies = [
    # The two environments pin different NumPy majors (SETUP.md §1; requirements/*.txt hold the exact versions).
    "numpy>=1.24",
    "scipy>=1.10",
    "rich>=13.0",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pillow>=10.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-xdist>=3.5"]

[tool.setuptools.packages.find]
include = ["nfl_gsplat*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA-capable GPU",
    "slow: takes more than ~10 seconds",
    "smoke: full end-to-end pipeline on synthetic fixtures",
    "real_video: requires real broadcast video + body models + annotations",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Select explicitly: ruff's default rule set grows with every release, and a linter
# release must not turn into a repo-wide diff (CI pins the ruff version too).
select = ["E", "F"]
# Not linted, by choice: E501 (lines are wrapped by hand, most near 120; long
# measured-value comments stay on one line), E702 (semicolons in tight numpy
# initialisers and test scaffolding), E731 (small named lambdas in tests and
# builders), E741 (`l` for a length or a limb where the maths names it so).
ignore = ["E501", "E702", "E731", "E741"]
