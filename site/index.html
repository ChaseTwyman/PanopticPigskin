<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PanopticPigskin: one NFL play, rebuilt in 3D</title>
    <meta
      name="description"
      content="Two broadcast All-22 clips of one NFL play, rebuilt as a 3D replay: every player placed on a calibrated field frame by frame, posed as a full human body, viewable from any angle, with a per-player report."
    />
    <!-- lets the Film Room and report pages tell this app shell apart from themselves -->
    <meta name="pp-shell" content="1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090e0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Resolve the theme before first paint: a stored choice wins, else the OS setting.
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem("pp-theme");
        } catch (e) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          try {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            theme = "light";
          }
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5">
        PanopticPigskin needs JavaScript. The per-player report is also a plain page:
        <a href="/embed/report/index.html">/embed/report/index.html</a>.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
